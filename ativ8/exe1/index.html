<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ex 01 - Validador de CPF</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 1.3rem; margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    #resultado { margin-top: 15px; padding: 12px; border-radius: 5px; font-weight: bold; display: none; }
    .valido   { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .invalido { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <h1> Exercício 01  Validador de CPF</h1>

  <label for="cpf">CPF:</label>
  <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">

  <button onclick="validar()">Validar</button>

  <div id="resultado"></div>

  <script>
    // Aplica máscara enquanto digita
    document.getElementById('cpf').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
      else if (v.length > 6) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
      else if (v.length > 3) v = v.slice(0,3)+'.'+v.slice(3);
      this.value = v;
    });

    function validar() {
      const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
      const res = document.getElementById('resultado');
      res.style.display = 'block';

      // Verifica tamanho e sequências repetidas
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) {
        res.className = 'invalido';
        res.textContent = '❌ CPF Inválido!';
        return;
      }

      // Calcula 1º dígito verificador (pesos 10 a 2)
      let soma = 0;
      for (let i = 0; i < 9; i++) soma += Number(cpf[i]) * (10 - i);
      let resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== Number(cpf[9])) {
        res.className = 'invalido';
        res.textContent = '❌ CPF Inválido!';
        return;
      }

      // Calcula 2º dígito verificador (pesos 11 a 2)
      soma = 0;
      for (let i = 0; i < 10; i++) soma += Number(cpf[i]) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== Number(cpf[10])) {
        res.className = 'invalido';
        res.textContent = '❌ CPF Inválido!';
        return;
      }

      res.className = 'valido';
      res.textContent = '✅ CPF Válido!';
    }
  </script>

</body>
</html>
