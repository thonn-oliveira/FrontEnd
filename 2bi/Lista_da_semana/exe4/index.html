<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ex 04 - Infinity Bank</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 1.3rem; margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 12px; }
    button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    #resultado { margin-top: 15px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    td { padding: 8px 10px; border: 1px solid #ccc; }
    td:first-child { font-weight: bold; background: #f5f5f5; }
    .destaque td { background: #d4edda; font-weight: bold; }
  </style>
</head>
<body>

  <h1>💳 Exercício 04 — Infinity Bank</h1>

  <label for="bandeira">Bandeira:</label>
  <select id="bandeira">
    <option value="visa">Visa (2%)</option>
    <option value="master">Mastercard (1.85%)</option>
    <option value="elo">Elo (3%)</option>
  </select>

  <label for="valor">Valor da Venda (R$):</label>
  <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 500.00">

  <label for="parcelas">Número de Parcelas:</label>
  <select id="parcelas">
    <option value="1">1x</option>
    <option value="2">2x</option>
    <option value="3">3x</option>
    <option value="4">4x</option>
    <option value="5">5x</option>
    <option value="6">6x</option>
    <option value="7">7x</option>
    <option value="8">8x</option>
    <option value="9">9x</option>
    <option value="10">10x</option>
    <option value="11">11x</option>
    <option value="12">12x</option>
  </select>

  <button onclick="simular()">Simular</button>

  <div id="resultado">
    <table>
      <tr><td>Taxa da Bandeira</td><td id="tTaxa"></td></tr>
      <tr><td>Juros Totais</td>    <td id="tJuros"></td></tr>
      <tr><td>Taxa Mensal</td>     <td id="tMensal"></td></tr>
      <tr><td>Valor Total</td>     <td id="tTotal"></td></tr>
      <tr class="destaque"><td>Valor da Parcela</td><td id="tParcela"></td></tr>
    </table>
  </div>

  <script>
    function simular() {
      const valor    = Number(document.getElementById('valor').value);
      const parcelas = Number(document.getElementById('parcelas').value);
      const bandeira = document.getElementById('bandeira').value;

      if (!valor || valor <= 0) {
        alert('Informe um valor válido.');
        return;
      }

      // Taxa por bandeira usando switch
      let taxaPct;
      switch (bandeira) {
        case 'visa':   taxaPct = 0.02;   break;
        case 'master': taxaPct = 0.0185; break;
        case 'elo':    taxaPct = 0.03;   break;
      }

      const taxaBandeira  = valor * taxaPct;                  // taxa da bandeira
      const jurosTotais   = valor * (0.0035 * parcelas);      // 0,35% a.m. × parcelas
      const taxaMensal    = 12.50 * parcelas;                 // R$12,50 por mês
      const total         = valor + taxaBandeira + jurosTotais + taxaMensal;
      const valorParcela  = total / parcelas;

      const fmt = n => 'R$ ' + n.toFixed(2);

      document.getElementById('tTaxa').textContent    = fmt(taxaBandeira);
      document.getElementById('tJuros').textContent   = fmt(jurosTotais);
      document.getElementById('tMensal').textContent  = fmt(taxaMensal);
      document.getElementById('tTotal').textContent   = fmt(total);
      document.getElementById('tParcela').textContent = `${parcelas}x de ${fmt(valorParcela)}`;

      document.getElementById('resultado').style.display = 'block';
    }
  </script>

</body>
</html>
