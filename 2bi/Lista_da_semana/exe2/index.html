<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ex 02 - Conversor de Temperatura</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 1.3rem; margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 15px; }
    p { color: #555; font-size: 0.9rem; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>🌡️ Exercício 02 — Conversor de Temperatura</h1>

  <label for="celsius">Celsius (°C):</label>
  <input type="number" id="celsius" step="0.1" placeholder="Ex: 25">

  <label for="fahrenheit">Fahrenheit (°F):</label>
  <input type="number" id="fahrenheit" step="0.1" placeholder="Ex: 77">

  <p>Digite em qualquer campo para converter automaticamente.</p>

  <script>
    // Celsius → Fahrenheit: F = (C * 9/5) + 32
    document.getElementById('celsius').addEventListener('input', function () {
      const c = parseFloat(this.value);
      if (this.value === '' || isNaN(c)) {
        document.getElementById('fahrenheit').value = '';
        return;
      }
      document.getElementById('fahrenheit').value = ((c * 9 / 5) + 32).toFixed(2);
    });

    // Fahrenheit → Celsius: C = (F - 32) * 5/9
    document.getElementById('fahrenheit').addEventListener('input', function () {
      const f = parseFloat(this.value);
      if (this.value === '' || isNaN(f)) {
        document.getElementById('celsius').value = '';
        return;
      }
      document.getElementById('celsius').value = ((f - 32) * 5 / 9).toFixed(2);
    });
  </script>

</body>
</html>
