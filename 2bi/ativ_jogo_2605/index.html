<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header>
      <h1>Termo</h1>
      <button id="restart" class="restart" type="button" hidden>Reiniciar</button>
    </header>

    <section id="board" class="grid" aria-label="Tabuleiro do jogo"></section>
    <p id="message" class="message" aria-live="polite"></p>
    <section id="keyboard" class="keyboard" aria-label="Teclado virtual"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
